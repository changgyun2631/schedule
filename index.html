<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>일정관리</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b2030;--mut:#5f6678;--ln:#e2e5ec;--acc:#1f5fd6;--accbg:#e8f0fe;--red:#c62828;--redbg:#fdecec;--ev:#7b3fc4;--ok:#2e7d32;--shadow:0 1px 2px rgba(20,30,60,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#101319;--card:#1a1e27;--tx:#eceef4;--mut:#9aa2b5;--ln:#2b3140;--acc:#7fb0ff;--accbg:#1f2c47;--red:#ff8a8a;--redbg:#3a1f22;--ev:#c9a3ff;--ok:#7fd18b;--shadow:none}}
:root{--c-work:#1f5fd6;--c-workbg:#e8f0fe;--c-meet:#b45309;--c-meetbg:#fff1dc;--c-car:#0f766e;--c-carbg:#dff4f0;--c-me:#be185d;--c-mebg:#fde7f0;--c-game:#7b3fc4;--c-gamebg:#f0e7fb;--c-etc:#5f6678;--c-etcbg:#eceef3}
@media(prefers-color-scheme:dark){:root{--c-work:#7fb0ff;--c-workbg:#1f2c47;--c-meet:#fbbf6a;--c-meetbg:#3a2a12;--c-car:#5fd4c6;--c-carbg:#12332f;--c-me:#f58bb8;--c-mebg:#3a1827;--c-game:#c9a3ff;--c-gamebg:#2c2040;--c-etc:#9aa2b5;--c-etcbg:#2b3140}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Pretendard,'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:22px;line-height:1.3;margin:0}
h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.sub{color:var(--mut);font-size:14px}
.warn{background:var(--redbg);color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.cnt{font-size:13px;font-weight:600;border-radius:99px;padding:1px 9px;background:var(--accbg);color:var(--acc)}
.od h2{color:var(--red)}.od .cnt{background:var(--redbg);color:var(--red)}
ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:2.6em 1fr auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--ln)}
.dn{border:1px solid var(--ln);background:var(--card);color:var(--ok);font-weight:600;font-size:14px;border-radius:10px;min-height:40px;padding:0 12px;white-space:nowrap}
.dn:active{background:var(--accbg)}
#toast{position:fixed;left:12px;right:12px;bottom:14px;max-width:616px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.row:first-child{border-top:0;padding-top:2px}
.id{color:var(--mut);font-size:13px;padding-top:2px}
.tx{font-size:17px;line-height:1.45;word-break:keep-all}
.mt{color:var(--mut);font-size:13px}
.done .tx{color:var(--mut);text-decoration:line-through}
.empty{color:var(--mut);padding:4px 0}
.ev .tx{color:var(--ev)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:18px}
.nav{border:1px solid var(--ln);background:var(--card);border-radius:10px;width:44px;height:44px;font-size:18px}
.nav:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:13px;color:var(--mut);padding:4px 0}
.dow:first-child,.c.sun{color:var(--red)}
.dow:nth-child(7),.c.sat{color:var(--acc)}
.c{height:48px;min-width:0;border:1px solid transparent;background:transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 0 0;font-size:15px;gap:3px}
.c.out{visibility:hidden}
.c.has{background:var(--bg)}
.c.today{border-color:var(--acc);font-weight:700}
.c.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.c.sel .dot{background:#fff!important}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.dot.k-work{background:var(--c-work)}.dot.k-meet{background:var(--c-meet)}.dot.k-car{background:var(--c-car)}.dot.k-me{background:var(--c-me)}.dot.k-game{background:var(--c-game)}.dot.k-etc{background:var(--c-etc)}
.dot.d{background:var(--mut)!important;opacity:.5}
.pill{display:inline-block;font-size:12px;font-weight:600;line-height:1.5;border-radius:6px;padding:0 7px}
.p-work{color:var(--c-work);background:var(--c-workbg)}.p-meet{color:var(--c-meet);background:var(--c-meetbg)}.p-car{color:var(--c-car);background:var(--c-carbg)}
.p-me{color:var(--c-me);background:var(--c-mebg)}.p-game{color:var(--c-game);background:var(--c-gamebg)}.p-etc{color:var(--c-etc);background:var(--c-etcbg)}
.tm{font-variant-numeric:tabular-nums;color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:0;z-index:2;background:var(--bg);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:0 14px;min-height:40px;font-size:15px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip i{font-style:normal;font-size:12px;opacity:.8;margin-left:5px}
.day{margin-top:14px;border-top:1px solid var(--ln);padding-top:12px}
.day h3{font-size:15px;margin:0 0 6px}
details summary{cursor:pointer;font-weight:600;padding:2px 0}
.hint{color:var(--mut);font-size:13px;margin-top:6px}
.lock{max-width:360px;margin:14vh auto 0;text-align:center}
.lock input[type=password]{width:100%;font-size:18px;padding:13px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--card);margin:14px 0 10px}
.lock label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--mut);margin-bottom:14px}
.lock label input{width:20px;height:20px}
.go{width:100%;font-size:17px;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:13px}
.go:disabled{opacity:.6}
.err{color:var(--red);min-height:1.6em;margin-top:10px;font-size:14px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:13px;padding:6px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="lock" class="lock" hidden>
  <h1>일정관리</h1>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호" required>
    <label><input id="rem" type="checkbox"> 이 기기에서 기억하기</label>
    <button class="go" id="go" type="submit">열기</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<section id="app" hidden>
  <div class="top"><div><h1 id="today"></h1><div class="sub" id="upd"></div></div></div>
  <div id="stale" class="warn" hidden></div>
  <div id="chips" class="chips" role="group" aria-label="카테고리"></div>
  <div id="od" class="card od" hidden><h2>⚠ 밀린 일 <span class="cnt" id="odn"></span></h2><ul id="odl"></ul></div>
  <div class="card"><h2>📌 오늘</h2><ul id="tl"></ul></div>
  <div class="card"><h2>🔜 내일</h2><ul id="nl"></ul></div>
  <div class="card">
    <div class="cal-h"><button class="nav" id="prev" aria-label="이전 달">‹</button><b id="mon"></b><button class="nav" id="next" aria-label="다음 달">›</button></div>
    <div class="grid" id="dow"></div>
    <div class="grid" id="cal"></div>
    <div class="day"><h3 id="dayh"></h3><ul id="dayl"></ul></div>
  </div>
  <div class="card"><details><summary>🔁 반복 일정 <span class="cnt" id="rn"></span></summary><ul id="rl" style="margin-top:8px"></ul></details></div>
  <div class="hint">웹에서는 완료만 됩니다(GitHub 로그인 필요). 넣기·삭제는 텔레그램 봇에서 합니다.</div>
  <button class="link" id="forget" hidden>이 기기 기억 해제</button>
</section>
<div id="toast" role="status" hidden></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const toStr=d=>`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const addDays=(s,n)=>{const d=parse(s);d.setUTCDate(d.getUTCDate()+n);return toStr(d)};
const WD='일월화수목금토';
const fmt=s=>{const d=parse(s);return `${d.getUTCMonth()+1}/${d.getUTCDate()}(${WD[d.getUTCDay()]})`};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const kstToday=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...u));
const KEY='schedule-key-v1';

let data=null,key=null,T=kstToday(),viewYM=T.slice(0,7),sel=T;
// 카테고리: 맨 위 버튼으로 고른다(이 기기에 기억). 데이터의 c가 없으면 기타.
const CATS=['업무','미팅','차량','개인','경기','기타'],CK={업무:'work',미팅:'meet',차량:'car',개인:'me',경기:'game',기타:'etc'};
const catOf=x=>CK[x.c]?x.c:'기타';
let cat='';try{cat=localStorage.getItem('schedule-cat')||''}catch(_){}
const vis=x=>!cat||catOf(x)===cat;
const pill=c=>`<span class="pill p-${CK[c]}">${c}</span>`;

async function fetchBlob(){const r=await fetch('data.enc.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('데이터를 불러오지 못했어요');return r.json()}
async function deriveKey(pw,blob){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64d(blob.salt),iterations:blob.iter},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function decrypt(blob,k){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(blob.iv)},k,b64d(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function overdue(){
  const out=[],last={},wk=[0,6].includes(parse(T).getUTCDay());
  for(const x of data.items){
    if(x.ev||x.done||x.date>=T)continue;
    if(x.k==='o'){out.push(x);continue}
    if(!last[x.id]||x.date>last[x.id].date)last[x.id]=x;     // 반복은 가장 최근 회차만
  }
  for(const id in last){const x=last[id];if(x.date>x.added&&!(x.k==='m'&&wk))out.push(x)}   // 월 반복은 주말엔 조용히, 월요일에 다시
  return out.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
}
function row(x,opt={}){
  const meta=[opt.date?fmt(x.date):'',opt.ago?`${diff(T,x.date)}일 지남`:'',x.early?'마감이 주말이라 미리':'',x.k==='m'?'매달':x.k==='w'?'매주':''].filter(Boolean).join(' · ');
  const btn=!x.done&&!x.ev&&x.date<=addDays(T,1)?`<button class="dn" data-id="${x.id}" aria-label="#${x.id} 완료">✔ 완료</button>`:'';   // 오늘·내일·밀린 일만(경기는 제외)
  const tm=x.t?`<b class="tm">${esc(x.t)}</b> `:'';
  return `<li class="row${x.done?' done':''}${x.ev?' ev':''}"><span class="id">#${x.id}</span><div><div class="tx">${tm}${esc(x.text)}</div><div class="mt">${pill(catOf(x))}${meta?' '+esc(meta):''}</div></div>${btn}</li>`;
}
function chips(){
  const present=new Set([...data.items,...data.rules].map(catOf));
  if(cat&&!present.has(cat))cat='';
  const soon=[...overdue(),...data.items.filter(x=>!x.done&&(x.date===T||x.date===addDays(T,1)))],cnt={};
  soon.forEach(x=>cnt[catOf(x)]=(cnt[catOf(x)]||0)+1);
  $('chips').innerHTML=[''].concat(CATS.filter(c=>present.has(c))).map(c=>`<button class="chip${c===cat?' on':''}" data-c="${c}" aria-pressed="${c===cat}">${c||'전체'}${c&&cnt[c]?`<i>${cnt[c]}</i>`:''}</button>`).join('');
}
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;try{localStorage.setItem('schedule-cat',cat)}catch(_){}render()};
// 완료 버튼: 토큰 없이, 미리 채운 GitHub 새 이슈 화면을 연다. 거기서 Submit을 누르면 내 PC의 봇이 읽어 완료 처리한다.
const REPO='changgyun2631/schedule';
let toastTimer;
document.addEventListener('click',e=>{
  const b=e.target.closest('.dn');if(!b)return;
  const q=new URLSearchParams({title:`done ${b.dataset.id}`,body:'웹페이지에서 보낸 완료 요청입니다. 내 PC의 봇이 읽고 처리한 뒤 이 이슈를 닫습니다. 제목은 바꾸지 마세요.'});
  window.open(`https://github.com/${REPO}/issues/new?${q}`,'_blank','noopener');
  const t=$('toast');t.hidden=false;t.textContent=`열린 GitHub 화면 맨 아래의 "Submit new issue"를 눌러야 #${b.dataset.id} 완료가 전달돼요. 1~2분 뒤 이 목록에서 사라져요.`;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,12e3);
});
function list(el,items,emptyMsg,opt){el.innerHTML=items.length?items.map(x=>row(x,opt)).join(''):`<li class="empty">${emptyMsg}</li>`}
const on=d=>data.items.filter(x=>x.date===d&&vis(x)).sort((a,b)=>a.done-b.done||(a.t||'99:99').localeCompare(b.t||'99:99')||a.id-b.id);   // 끝낸 건 아래, 시각 있는 것 먼저

function render(){
  const d=parse(T);
  $('today').textContent=`${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 ${WD[d.getUTCDay()]}요일`;
  const u=data.updated?new Date(data.updated):null;
  $('upd').textContent=u?`${u.getMonth()+1}/${u.getDate()} ${pad(u.getHours())}:${pad(u.getMinutes())} 기준`:'';
  const age=u?Math.floor((Date.now()-u)/864e5):0;
  $('stale').hidden=age<3;$('stale').textContent=`⚠ ${age}일째 새 내용이 안 올라왔어요(PC가 꺼져 있을 수 있어요). 날짜는 맞게 표시됩니다.`;
  chips();
  const od=overdue().filter(vis);$('od').hidden=!od.length;$('odn').textContent=od.length;list($('odl'),od,'',{date:1,ago:1});
  const t=on(T).filter(x=>!x.done),n=on(addDays(T,1)).filter(x=>!x.done);
  list($('tl'),t,on(T).length?'오늘 할 일을 모두 끝냈어요 ✔':'오늘은 비어 있어요');
  list($('nl'),n,'내일은 비어 있어요');
  const rules=data.rules.filter(vis);
  $('rn').textContent=rules.length;
  $('rl').innerHTML=rules.map(r=>`<li class="row"><span class="id">#${r.id}</span><div><div class="tx">${esc(r.label)}</div><div class="mt">${pill(catOf(r))}</div></div></li>`).join('');
  calendar();
}
function calendar(){
  const [y,m]=viewYM.split('-').map(Number),first=new Date(Date.UTC(y,m-1,1)),n=new Date(Date.UTC(y,m,0)).getUTCDate();
  $('mon').textContent=`${y}년 ${m}월`;
  $('prev').disabled=viewYM<=addDays(T,-41).slice(0,7);$('next').disabled=viewYM>=addDays(T,120).slice(0,7);
  $('dow').innerHTML=[...WD].map(c=>`<div class="dow">${c}</div>`).join('');
  let h='';for(let i=0;i<first.getUTCDay();i++)h+='<div class="c out"></div>';
  for(let i=1;i<=n;i++){
    const ds=`${y}-${pad(m)}-${pad(i)}`,it=on(ds),dow=(first.getUTCDay()+i-1)%7;
    const dots=it.slice(0,3).map(x=>`<i class="dot k-${CK[catOf(x)]}${x.done?' d':''}"></i>`).join('');
    h+=`<button class="c${it.length?' has':''}${ds===T?' today':''}${ds===sel?' sel':''}${dow===0?' sun':dow===6?' sat':''}" data-d="${ds}" aria-label="${fmt(ds)} 일정 ${it.length}개"><span>${i}</span><span class="dots">${dots}</span></button>`;
  }
  $('cal').innerHTML=h;
  $('dayh').textContent=fmt(sel)+(sel===T?' · 오늘':'');
  list($('dayl'),on(sel),'이 날은 비어 있어요');
}
$('cal').onclick=e=>{const b=e.target.closest('.c[data-d]');if(b){sel=b.dataset.d;calendar()}};
$('prev').onclick=()=>{const[y,m]=viewYM.split('-').map(Number);viewYM=toStr(new Date(Date.UTC(y,m-2,1))).slice(0,7);calendar()};
$('next').onclick=()=>{const[y,m]=viewYM.split('-').map(Number);viewYM=toStr(new Date(Date.UTC(y,m,1))).slice(0,7);calendar()};

function showApp(remembered){$('lock').hidden=true;$('app').hidden=false;$('forget').hidden=!remembered;render()}
function showLock(msg){$('app').hidden=true;$('lock').hidden=false;$('err').textContent=msg||'';$('go').disabled=false;$('go').textContent='열기';$('pw').value='';$('pw').focus()}

$('f').onsubmit=async e=>{
  e.preventDefault();$('go').disabled=true;$('go').textContent='확인 중…';$('err').textContent='';
  try{
    const blob=await fetchBlob(),k=await deriveKey($('pw').value,blob);
    try{data=await decrypt(blob,k)}catch(_){return showLock('비밀번호가 맞지 않아요')}
    key=k;
    if($('rem').checked)localStorage.setItem(KEY,JSON.stringify({salt:blob.salt,key:b64e(new Uint8Array(await crypto.subtle.exportKey('raw',k)))}));
    showApp($('rem').checked);
  }catch(err){showLock(err.message)}
};
$('forget').onclick=()=>{localStorage.removeItem(KEY);key=data=null;showLock()};

async function reload(){   // 5분마다·화면으로 돌아올 때 새 내용을 받는다
  if(!key)return;
  try{const blob=await fetchBlob();data=await decrypt(blob,key);render()}catch(_){/* 네트워크 실패는 이전 화면 유지 */}
}
setInterval(()=>{const t=kstToday();if(t!==T&&data){T=t;viewYM=t.slice(0,7);sel=t;render()}},60e3);
setInterval(reload,300e3);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)reload()});

(async()=>{
  try{
    const saved=JSON.parse(localStorage.getItem(KEY)||'null'),blob=await fetchBlob();
    if(saved&&saved.salt===blob.salt){
      const k=await crypto.subtle.importKey('raw',b64d(saved.key),'AES-GCM',true,['decrypt']);
      try{data=await decrypt(blob,k);key=k;return showApp(true)}catch(_){localStorage.removeItem(KEY)}
    }
  }catch(_){}
  showLock();
})();
</script>
</body>
</html>
